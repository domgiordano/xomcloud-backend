name: Deploy Xomcloud Backend

on:
  push:
    branches: [master]
  workflow_dispatch:


env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  APP_NAME: xomcloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  deploy-authorizer:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push authorizer image
        run: |
          docker build -f Dockerfile.authorizer -t ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-authorizer:latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-authorizer:latest

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.APP_NAME }}-authorizer \
            --image-uri ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-authorizer:latest

  deploy-download-tracks:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push download-tracks image
        run: |
          docker build -f Dockerfile.download -t ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-download-tracks:latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-download-tracks:latest

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.APP_NAME }}-download-tracks \
            --image-uri ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-download-tracks:latest

  deploy-auth-token:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The ECR repo + Lambda function are created by xomcloud-infrastructure
      # terraform. If they don't exist yet, the push/update steps fail loudly;
      # apply terraform first, then re-run this job (workflow_dispatch).
      - name: Build and push auth-token image
        run: |
          docker build -f Dockerfile.auth-token -t ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-auth-token:latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-auth-token:latest

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.APP_NAME }}-auth-token \
            --image-uri ${{ env.ECR_REGISTRY }}/${{ env.APP_NAME }}-auth-token:latest
